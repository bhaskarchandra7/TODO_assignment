<!DOCTYPE html>
<html>
<head>
    <title>ToDo App</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #ffffff;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .sidebar h3 {
            margin-bottom: 10px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            padding: 8px;
            cursor: pointer;
            color: #333;
        }

        .sidebar li:hover {
            background: #eef1ff;
        }

        /* Task List */
        .task-list {
            width: 40%;
            padding: 20px;
            background: #ffffff;
        }

        .task {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .task:hover {
            background: #f1f3ff;
        }

        /* Task Details */
        .task-detail {
            width: 40%;
            padding: 20px;
            background: #fafbff;
            border-left: 1px solid #ddd;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            background: #4f46e5;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc2626;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
